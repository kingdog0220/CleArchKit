services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: clearchkit-app
    volumes:
      - ./:/workspace:cached
    working_dir: /workspace
    ports:
      - "127.0.0.1:5284:5000" #HTTP
      - "127.0.0.1:5285:5001" #HTTPS
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: clearchkit-postgres
    environment:
      POSTGRES_DB: template
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
