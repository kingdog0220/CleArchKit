version: "3.9"

services:
  app:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: clearchkit-app
    volumes:
      - ./:/workspace:cached
      - ./.devcontainer:/workspace/.devcontainer:cached
    working_dir: /workspace
    ports:
      - "5284:5000"  # HTTP
      - "5285:5001"  # HTTPS
    command: sleep infinity
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: clearchkit-postgres
    environment:
      POSTGRES_DB: blazor_wasm_template
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
